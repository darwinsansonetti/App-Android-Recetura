name: mr_recetura
description: App móvil MR. Recetura
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:      # ← NUEVO
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP + serialización
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # Estado
  flutter_riverpod: ^2.6.1

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3

  # Navegación
  go_router: ^14.6.2

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/